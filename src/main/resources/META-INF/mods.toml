# 模组元数据。本文件里的 ${} 占位符由 build.gradle 的 processResources 任务从
# gradle.properties 展开，不要在这里手写死值（中文另见 gradle.properties 里的编码说明）。
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]

modId="${mod_id}"

version="${mod_version}"

displayName="${mod_name}"

credits="${mod_credits}"

authors="${mod_authors}"

# 说明文本取自 gradle.properties 的 mod_description（由 readUtf8Property 按 UTF-8 读取，
# 否则中文在 Windows 上会变成乱码）。
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Curios API —— 可选前置：为将来「随身听可佩戴在饰品栏」预留。
# mandatory=false 意味着玩家不装 Curios 也能正常加载本模组，只是相关功能不生效；
# ordering=AFTER 保证装了 Curios 时本模组在其之后加载。代码里引用 Curios 类型前
# 必须先判断 ModList.get().isLoaded("curios")。
[[dependencies.${mod_id}]]
    modId="curios"
    mandatory=false
    versionRange="[5.9.1,)"
    ordering="AFTER"
    side="BOTH"
